apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# sclorg images source postgresql-start/*.sh after the server is up; used to create
# a second database for the basic-auth user store.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-start-hooks
data:
  create-auth-db.sh: |
    psql -tAc "SELECT 1 FROM pg_database WHERE datname='mlflow_auth'" | grep -q 1 \
      || psql -c "CREATE DATABASE mlflow_auth OWNER \"$POSTGRESQL_USER\""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: mlflow
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef: {name: mlflow-postgres, key: username}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: mlflow-postgres, key: password}
          readinessProbe:
            exec:
              command: [/usr/libexec/check-container]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/libexec/check-container, --live]
            initialDelaySeconds: 120
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: start-hooks
              mountPath: /opt/app-root/src/postgresql-start
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: start-hooks
          configMap:
            name: postgres-start-hooks
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
